# Per-symbol config — broker: IUX (no symbol suffix, e.g. "EURUSD" not "EURUSD.r")
# P1 scope = EURUSD only (active: true). Others are pinned defaults from the
# architecture doc §11, kept disabled until P4 multi-symbol expansion.

EURUSD:
  active: true
  class: fx_major
  max_spread_pts: 15          # ~1.0 pip cap at 0.1pt/point on 5-digit quotes — recalibrate from live IUX quotes
  max_slippage_pts: 10
  max_tick_age_s: 30
  catastrophe_sl_atr: null     # off by default per doc; set e.g. 3.0 to enable
  max_risk_per_trade: 0.005    # 0.5% equity
  min_edge: 0.05               # |p_up - 0.5| gate, tune during P1 walk-forward
  min_ev: 0.0                  # ATR units, tune during P1 walk-forward
  filling: 1                   # mt5.ORDER_FILLING_IOC — verify against IUX symbol_info().filling_mode
  sessions: [london, newyork]

